<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="200" y1="200" x2="824" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle dark gloss -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="222" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Glowing Aura Back -->
  <circle cx="512" cy="480" r="280" fill="#6366F1" opacity="0.25" filter="url(#glow)"/>

  <!-- Academic Open Book Wings / Stylized "Y" Geometric Crest -->
  <path d="M512 360 L680 260 C720 236 770 268 770 316 L770 620 C770 660 730 690 690 710 L512 790 L334 710 C294 690 254 660 254 620 L254 316 C254 268 304 236 344 260 L512 360 Z" 
        fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Inner Center Book Spine / Y Stem -->
  <path d="M512 370 L512 780" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
  <path d="M512 370 L640 290 M512 370 L384 290" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.75"/>

  <!-- Master Achievement Diamond Star at Top -->
  <path d="M512 180 L528 220 L568 236 L528 252 L512 292 L496 252 L456 236 L496 220 Z" fill="url(#sparkGrad)" filter="url(#glow)"/>

  <!-- Sleek Modern Typography "YDS" Monogram Bottom Curve -->
  <text x="512" y="880" text-anchor="middle" font-family="-apple-system, system-ui, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" letter-spacing="14" opacity="0.95">YDS</text>
  <text x="512" y="930" text-anchor="middle" font-family="-apple-system, system-ui, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="34" fill="#A5B4FC" letter-spacing="8" opacity="0.8">MASTER</text>
</svg>